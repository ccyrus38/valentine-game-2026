    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #fff0f5; /* LavenderBlush */
            color: #881337; 
            overflow-x: hidden;
        }
        .mono-font { font-family: 'Share Tech Mono', monospace; }
        
        /* 漂浮動畫 (更輕盈) */
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
        
        .floating-item {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: floatUp linear infinite;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 相框漂浮 */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) rotate(var(--rot)); }
            50% { transform: translateY(-10px) rotate(var(--rot)); }
        }
        .animate-gentle-float {
            animation: gentleFloat 6s ease-in-out infinite;
        }

        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 泡泡框特效 */
        .bubble-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(3px); /* 降低模糊度，更透亮 */
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.05),
                inset 0 0 20px rgba(255, 255, 255, 0.5); /* 內發光模擬泡泡 */
            border-radius: 2rem;
        }

        /* ✨ 閃亮亮錯誤特效 ✨ */
        @keyframes sparkleText {
            0%, 100% { 
                text-shadow: 0 0 10px #ff00de, 0 0 20px #ff00de; 
                transform: scale(1) rotate(-3deg); 
            }
            50% { 
                text-shadow: 0 0 30px #ff00de, 0 0 40px #ff99cc, 0 0 50px #fff; 
                transform: scale(1.3) rotate(3deg); 
            }
        }
        .sparkle-error {
            animation: sparkleText 0.4s infinite; /* 快速閃爍 */
            background: linear-gradient(to bottom, #ff0055, #ff00cc);
            -webkit-background-clip: text;
            color: #d6006c; 
            font-weight: 900;
            filter: drop-shadow(0 4px 4px rgba(255,255,255,0.8));
            width: 100%;
            display: block;
        }
    </style>
</head>

                warn: 'text-purple-600', 
                error: 'text-red-500', 
                success: 'text-rose-600' 
            };
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            state.logs.push({ time, msg, color: colors[type] });
            render();
            
            // 自動滾動日誌到最底部

            if (container) {
                container.scrollTop = container.scrollHeight;

        function startBootSequence() {
            const lines = [
                "正在載入甜蜜回憶...",
                "同步愛心頻率中...",
                `目標對象: ${GAME_DATA.agentName}`,
                "準備開啟戀愛冒險..."
            ];
            let currentLine = 0;
            
            function typeLine() {
                if (currentLine >= lines.length) {
                    setTimeout(() => {
                        setState({ gameState: 'locked' });
                    }, 800);
                    return;
                }
                const text = lines[currentLine];
                const element = document.getElementById(`boot-line-${currentLine}`);
                if (!element) return;
                
                let i = 0;
                const interval = setInterval(() => {
                    element.innerHTML = "♥ " + text.substring(0, i + 1) + `<span class="animate-pulse">_</span>`;
                    i++;
                    if (i === text.length) {
                        clearInterval(interval);
                        element.innerHTML = "♥ " + text; // 移除光標
                        currentLine++;
                        setTimeout(typeLine, 500);
                    }
                }, 50);
            }
            setTimeout(typeLine, 200);
        }

        // 2. 開始鎖定畫面
        function renderLocked() {
            return `
                <div class="h-screen bg-rose-50 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                    <div class="z-10 text-center space-y-8 max-w-lg w-full">
                        <div class="flex justify-center mb-6">
                            <div class="bubble-box p-6 backdrop-blur-md animate-bounce bg-white/30 border-white/60">
                                ${SVGS.lock}
                            </div>
                        </div>
                        <div>
                            <h1 class="text-4xl font-bold text-rose-800 mb-2 tracking-widest drop-shadow-sm">LOCKED MEMORY</h1>
                            <p class="text-rose-400 mono-font text-sm tracking-widest bg-white/30 inline-block px-4 py-1 rounded-full border border-white/40">MISSION: ${GAME_DATA.missionCode}</p>
                        </div>
                        <div class="bubble-box p-8 text-left shadow-[0_10px_40px_rgba(255,200,200,0.3)] bg-gradient-to-b from-white/40 to-white/10">
                            <p class="text-rose-800 mb-6 leading-relaxed text-lg font-medium">
                                親愛的 <strong class="text-pink-600">${GAME_DATA.agentName}</strong>，系統偵測到大量我們珍貴的回憶檔案。
                                請解開愛的密碼。
                            </p>
                            <button onclick="startGame()" class="w-full bg-white/40 hover:bg-white/60 border border-white/60 text-rose-600 font-bold text-xl py-4 rounded-full shadow-lg hover:shadow-xl transition-all active:scale-95">
                                [ 開始愛的冒險 ]
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.startGame = function() {
            setState({ gameState: 'searching' });
        };

        // 3. 遊戲進行與探索畫面
        function renderGameplay() {
            const currentLevel = GAME_DATA.locations[state.currentLevelIndex];
            const progress = Math.round((state.currentLevelIndex / GAME_DATA.locations.length) * 100);
            
            let mainSection = '';
            
            if (state.gameState === 'searching') {
                mainSection = `
                    <div class="space-y-4 fade-in">
                        <div class="text-xs text-rose-500 mono-font mb-2 text-center bg-white/40 py-1 rounded-full border border-white/40 inline-block px-4 mx-auto block w-fit shadow-sm">--- 請選擇調查區域 ---</div>
                        <div class="grid grid-cols-1 gap-4">
                            ${currentLevel.searchPoints.map((point, idx) => `
                                <button onclick="handleSearch(${idx})" class="group bg-white/30 hover:bg-white/50 border border-white/60 p-5 rounded-[2rem] text-left flex items-center justify-between shadow-sm hover:shadow-md active:scale-[0.98] transition-all backdrop-blur-[2px]">
                                    <span class="flex items-center gap-4 text-lg font-bold text-rose-800 drop-shadow-sm">
                                        <div class="bg-white/40 p-2 rounded-full transition-colors text-pink-500 shadow-sm">
                                            ${SVGS.search}
                                        </div>
                                        ${point.name}
                                    </span>
                                    ${SVGS.chevronRight}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.gameState === 'solving') {
                mainSection = `
                    <div class="fade-in bubble-box p-6 bg-gradient-to-b from-white/40 to-white/20 shadow-xl">
                        <div class="flex gap-4 mb-6 bg-white/30 p-4 rounded-[1.5rem] border border-white/40">
                            <div class="bg-white/50 p-3 rounded-full h-fit shadow-sm">
                                ${SVGS.key}
                            </div>
                            <div>
                                <h3 class="text-pink-600 font-mono text-xs mb-1 font-bold tracking-wider">✨ SECRET FOUND</h3>
                                <p class="text-rose-900 font-bold leading-relaxed drop-shadow-sm">${state.foundClue.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>

                        <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                            <div class="relative">
                                <input 
                                    type="text" 
                                    id="answer-input"
                                    placeholder="請輸入愛的密碼..."
                                    value="${state.inputAnswer}"
                                    oninput="state.inputAnswer = this.value"
                                    class="w-full bg-white/40 border-2 ${state.errorMsg ? 'border-red-400' : 'border-white/60 focus:border-white'} text-rose-700 font-mono text-xl py-4 px-6 rounded-full outline-none text-center tracking-widest placeholder:text-pink-400/70 shadow-inner transition-all backdrop-blur-sm ${state.isShaking ? 'shake' : ''}"
                                    autofocus
                                    autocomplete="off"
                                />
                                ${state.errorMsg ? `
                                    <div class="absolute top-full left-0 w-full text-center text-3xl mt-4 z-50 sparkle-error">
                                        ${state.errorMsg}
                                    </div>
                                ` : ''}
                            </div>
                            <button type="submit" class="w-full bg-white/40 hover:bg-white/60 border border-white/60 text-rose-600 font-bold text-lg py-4 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.6)] active:scale-95 transition-all">
                                UNLOCK / 解鎖回憶
                            </button>
                            <div class="text-center">
                                <button type="button" class="text-xs text-white hover:text-pink-200 underline decoration-dotted p-2 drop-shadow-md font-bold" onclick="showHintModal()">
                                    [ 偷偷看提示 ]
                                </button>
                            </div>
                        </form>
                    </div>
                `;
            } else if (state.gameState === 'unlocked') {
                mainSection = `
                    <div class="flex flex-col items-center justify-center py-12 animate-pulse text-pink-500 transform scale-110 transition-transform duration-500">
                        <div class="bubble-box p-6 bg-white/40 shadow-xl mb-6">
                            ${SVGS.unlock}
                        </div>
                        <div class="mono-font text-2xl font-bold tracking-widest text-white drop-shadow-lg text-stroke">ACCESS GRANTED</div>
                    </div>
                `;
            }

            return `
                <div class="min-h-screen bg-rose-50 text-rose-900 flex flex-col relative pb-40">
                    <!-- === 背景圖與相框 === -->
                    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
                        <div class="absolute inset-0 bg-gradient-to-br from-rose-50 via-pink-50 to-rose-100"></div>

                        <!-- 手機版背景圖 -->
                        <div class="md:hidden absolute inset-0 flex items-center justify-center">
                            <img 
                                src="${currentLevel.bgImage}" 
                                class="w-full h-full object-contain opacity-100" 
                                alt="background"
                                onerror="this.style.display='none'"
                            />
                            <div class="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-white/95 to-transparent"></div>
                        </div>

                        <!-- 電腦版：左右拍立得相框 -->
                        <div class="hidden md:block absolute inset-0">
                            <div class="absolute left-[2%] top-24 w-[35vw] h-[60vh] bubble-box p-3 shadow-2xl transform transition-all animate-gentle-float bg-white/20" style="--rot: -4deg">
                                <div class="w-full h-full rounded-[1.5rem] overflow-hidden shadow-inner flex items-center justify-center relative bg-white/30">
                                    <img src="${currentLevel.bgImage}" class="w-full h-full object-contain" onerror="this.style.display='none'" />
                                </div>
                            </div>
                            <div class="absolute right-[2%] top-24 w-[35vw] h-[60vh] bubble-box p-3 shadow-2xl transform transition-all animate-gentle-float bg-white/20" style="--rot: 4deg; animation-delay: 1s">
                                <div class="w-full h-full rounded-[1.5rem] overflow-hidden shadow-inner flex items-center justify-center relative bg-white/30">
                                    <img src="${currentLevel.bgImage}" class="w-full h-full object-contain" onerror="this.style.display='none'" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 頂部頁首 (Header) -->
                    <div class="bg-white/30 backdrop-blur-sm border-b border-white/40 p-4 flex justify-between items-center sticky top-0 z-30 shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white/40 rounded-full flex items-center justify-center border border-white/60 shadow-sm">
                                ${currentLevel.svgIcon}
                            </div>
                            <div>
                                <div class="text-[10px] text-pink-400 mono-font tracking-widest">LOC.${currentLevel.id}</div>
                                <div class="font-bold text-lg text-rose-800">${currentLevel.name}</div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <div class="mono-font text-xs text-pink-400">LEVEL</div>
                            <div class="text-rose-500 font-mono font-bold text-lg">${progress}%</div>
                        </div>
                    </div>

                    <!-- 主要內容區 -->
                    <main class="flex-1 p-6 max-w-2xl mx-auto w-full flex flex-col gap-6 z-10 relative">
                        <!-- 描述框 -->
                        <div class="bubble-box p-6 bg-gradient-to-b from-white/30 to-white/10 shadow-lg relative overflow-hidden backdrop-blur-[2px]">
                            <div class="absolute top-0 right-0 p-4 opacity-10 pointer-events-none">
                                ${currentLevel.svgIcon}
                            </div>
                            <h3 class="text-pink-500 font-bold mb-3 text-sm mono-font tracking-wider flex items-center gap-2 drop-shadow-sm">
                                ${SVGS.map} SCENE DESCRIPTION
                            </h3>
                            <p class="text-lg leading-relaxed text-rose-900 font-bold drop-shadow-sm relative z-10">${currentLevel.description}</p>
                        </div>

                        ${mainSection}
                    </main>

                    <!-- 底部即時通訊日誌 (Log Area) -->
                    <div class="fixed bottom-0 left-0 w-full bg-white/30 border-t border-white/40 p-3 h-32 font-mono text-sm shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-40 backdrop-blur-md">
                        <div class="text-pink-500 text-[10px] mb-2 flex justify-between px-2 font-bold">
                            <span>♥ L0VE LOG // v6.1</span>
                            <span class="animate-pulse text-rose-600">● LIVE</span>
                        </div>
                        <div id="log-container" class="overflow-y-auto h-20 flex flex-col space-y-1 scroll-smooth px-2">
                            ${state.logs.map(log => `
                                <div class="${log.color} break-words font-bold drop-shadow-sm">
                                    <span class="opacity-60 text-xs">[${log.time}]</span> ${log.msg}
                                </div>
                            `).join('')}
                            ${state.logs.length === 0 ? `<span class="text-pink-400 italic">{" > 等待輸入中..."}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. 終點勝利畫面
        function renderVictory() {
            return `
                <div class="h-screen bg-pink-50 flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                    <div class="mb-8 relative animate-bounce z-10">
                        <svg class="w-40 h-40 text-rose-500 fill-rose-500 drop-shadow-xl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    <div class="bubble-box p-8 shadow-2xl bg-white/40 border-white/60 z-10 max-w-lg">
                        <h2 class="text-3xl font-bold text-rose-600 mb-4 tracking-wider">MISSION COMPLETE!</h2>
                        <div class="text-rose-800 text-lg whitespace-pre-line leading-relaxed mb-6 font-medium">${GAME_DATA.finalMessage}</div>
                        <div class="border-t border-white/40 pt-4">
                            <p class="text-sm text-rose-400 mono-font mb-2">專屬獎勵代碼:</p>
                            <div class="text-2xl font-mono font-bold text-rose-600 tracking-[0.2em] select-all bg-white/30 p-3 rounded-2xl border border-white/50 dashed">Cyrus一晚3次精盡人亡券(只限一次)</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 🎮 遊戲事件控制器 (Event Handlers)
        // ==========================================

        // 調查選中區域
        window.handleSearch = function(idx) {
            const currentLevel = GAME_DATA.locations[state.currentLevelIndex];
            const point = currentLevel.searchPoints[idx];
            
            addLog(`正在查看: ${point.name}...`, 'info');
            setTimeout(() => {
                if (point.content.includes("線索發現")) {
                    setState({
                        foundClue: point.content,
                        gameState: 'solving'
                    });
                    addLog("✨ 發現重要回憶！", 'warn');
                    if (navigator.vibrate) navigator.vibrate(200);
                } else {
                    addLog(`回憶片段: ${point.content}`, 'info');
                }
            }, 600);
        };

        // 提交密碼驗證
        window.handleFormSubmit = function(e) {
            e.preventDefault();
            const currentLevel = GAME_DATA.locations[state.currentLevelIndex];
            
            // 讀取輸入值
            const inputVal = document.getElementById('answer-input').value;
            state.inputAnswer = inputVal;

            const cleanInput = inputVal.trim().toLowerCase().replace(/\s/g, '');
            const cleanAnswer = currentLevel.answer.toLowerCase().replace(/\s/g, '');

            addLog(`心靈感應中: ${inputVal}...`, 'info');

            if (cleanInput === cleanAnswer || cleanInput.includes(cleanAnswer)) {
                addLog("回答正確！愛心解鎖成功 ❤️", 'success');
                setState({ gameState: 'unlocked' });
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                
                setTimeout(() => {
                    if (state.currentLevelIndex + 1 < GAME_DATA.locations.length) {
                        setState({
                            currentLevelIndex: state.currentLevelIndex + 1,
                            gameState: 'searching',
                            foundClue: null,
                            inputAnswer: ''
                        });
                    } else {
                        setState({ gameState: 'victory' });
                    }
                }, 2500);
            } else {
                setState({
                    errorMsg: '🤭 小傻B 🤪',
                    isShaking: true,
                    inputAnswer: ''
                });
                addLog("錯誤：不是這個喔～", 'error');
                if (navigator.vibrate) navigator.vibrate(500);
                
                // 3 秒後恢復狀態
                setTimeout(() => {
                    setState({
                        errorMsg: '',
                        isShaking: false
                    });
                }, 3000);
            }
        };

        // 顯示悄悄話提示框（全新泡泡彈窗！）
        window.showHintModal = function() {
            const currentLevel = GAME_DATA.locations[state.currentLevelIndex];
            addLog(`查看了提示...`, 'warn');
            
            const modal = document.createElement('div');
            modal.id = 'custom-hint-modal';
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 z-50 fade-in';
            modal.innerHTML = `
                <div class="bubble-box p-8 max-w-md w-full bg-white text-center space-y-6 shadow-2xl relative">
                    <h3 class="text-xl font-bold text-rose-600">💡 悄悄話提示</h3>
                    <p class="text-rose-950 font-medium text-lg leading-relaxed">${currentLevel.hint}</p>
                    <button onclick="closeHintModal()" class="w-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-3 rounded-full shadow-sm active:scale-95 transition-all">
                        我知道了！
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.closeHintModal = function() {
            const modal = document.getElementById('custom-hint-modal');
            if (modal) modal.remove();
        };

        // ==========================================
        // 渲染引擎 (Render Engine)
        // ==========================================
        function render() {
            const root = document.getElementById('root');
            if (state.gameState === 'boot') {
                root.innerHTML = renderBoot();
            } else if (state.gameState === 'locked') {
                root.innerHTML = renderLocked();
            } else if (state.gameState === 'victory') {
                root.innerHTML = renderVictory();
            } else {
                root.innerHTML = renderGameplay();
            }
        }

        // ==========================================
        // 🌸 背景泡泡飄浮特效系統 🌸
        // ==========================================
        function initBubbles() {
            const container = document.getElementById('bubble-container');
            if (!container) return;
            
            setInterval(() => {
                const bubble = document.createElement('div');
                const left = Math.random() * 100;
                const duration = 8 + Math.random() * 10;
                const size = 10 + Math.random() * 30;
                const type = Math.random() > 0.5 ? 'heart' : 'bubble';
                const symbols = type === 'heart' ? ['❤️', '💖', '💗'] : ['○', '.。', '⚪', '✨'];
                const symbol = symbols[Math.floor(Math.random() * symbols.length)];

                bubble.className = `floating-item ${type === 'bubble' ? 'text-white/70' : 'text-pink-300/80'}`;
                bubble.style.left = `${left}%`;
                bubble.style.animationDuration = `${duration}s`;
                bubble.style.fontSize = `${size}px`;
                bubble.innerHTML = symbol;

                container.appendChild(bubble);
                
                // 動畫結束後自動清理，避免網頁卡頓
                setTimeout(() => {
                    bubble.remove();
                }, duration * 1000);
            }, 300);
        }

        // ==========================================
        // 🚀 遊戲啟動入口
        // ==========================================
        window.onload = function() {
            // 1. 初始化飄浮泡泡
            initBubbles();
            
            // 2. 初始化渲染
            render();
            
            // 3. 啟動打字動畫
            startBootSequence();
        };
    </script>
</body>
</html>
